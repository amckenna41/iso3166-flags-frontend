name: Deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Tests, Build]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
      
      - name: Deploy to Vercel
        run: |
          echo "Vercel deployment skipped - requires VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets"
          echo "To enable: Configure secrets in GitHub Settings"
      
      - name: Deploy to GitHub Pages (alternative)
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
        continue-on-error: true

  production-smoke-tests:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run smoke tests
        uses: cypress-io/github-action@v6
        with:
          start: npm start
          wait-on: 'http://localhost:3000'
          spec: cypress/e2e/app.cy.ts
          browser: chrome
        continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    needs: [deploy, production-smoke-tests]
    if: always()
    
    steps:
      - name: Notify deployment status
        run: echo "Slack notification skipped - requires SLACK_WEBHOOK secret"
        if: always()
        continue-on-error: true
