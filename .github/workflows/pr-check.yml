name: PR Quality Check

on:
  pull_request:
    branches: [main, develop]
  workflow_run:
    workflows: [Tests, Build, Code Quality]
    types: [completed]
    branches: [main, develop]

jobs:
  pr-comment:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests with coverage
        run: npm run test:ci
      
      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(grep -oP '(?<=Statements.*:\s)\d+(\.\d+)?(?=%\s)' coverage/coverage-summary.json || echo "0")
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
      
      - name: Post PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const comment = `## Test Results ✅\n\n- **Test Coverage**: ${coverage}%\n- **Build Status**: Passed\n- **E2E Tests**: Check workflow logs\n\n---\nThis PR will be auto-merged if all checks pass.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        continue-on-error: true

  merge-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Check PR status
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            if (pullRequest.mergeable === false) {
              core.setFailed('PR has merge conflicts or is not mergeable');
            }

  size-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Check changed files
        uses: actions/github-script@v9
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const largeFiles = files.filter(f => f.changes > 500);
            if (largeFiles.length > 0) {
              console.log('Large changed files detected:');
              largeFiles.forEach(f => console.log(`  - ${f.filename}: ${f.changes} changes`));
            }
        if: github.event_name == 'pull_request'
        continue-on-error: true
